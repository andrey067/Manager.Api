version: 1
kind: pipeline
spec:
  stages:
    - name: dotnet
      type: ci
      spec:
        volumes:
          - name: dockersock
            spec: {}
            type: temp
        steps:
          - name: dind
            type: background
            spec:
              container:
                image: docker:dind
                privileged: true
              mount:
                - name: dockersock
                  path: /var/run
          - name: build-and-test
            type: run
            spec:
              container: mcr.microsoft.com/dotnet/sdk:10.0
              envs:
                DOCKER_HOST: unix:///var/run/docker.sock
              mount:
                - name: dockersock
                  path: /var/run
              script: |
                cd dotnet
                dotnet restore Manager.Vsa.sln
                dotnet build Manager.Vsa.sln --no-restore
                dotnet test Manager.Vsa.sln --no-build --logger "trx;LogFileName=dotnet-results.trx"
    - name: python
      type: ci
      spec:
        steps:
          - name: install
            type: run
            spec:
              container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
              script: |
                cd python
                uv sync --frozen
          - name: lint
            type: run
            spec:
              container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
              script: |
                cd python
                uv run ruff check src tests
                uv run ruff format --check src tests
          - name: typecheck
            type: run
            spec:
              container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
              script: |
                cd python
                uv run mypy src
          - name: test
            type: run
            spec:
              container: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
              script: |
                cd python
                uv run python -m pytest tests -v --tb=short
